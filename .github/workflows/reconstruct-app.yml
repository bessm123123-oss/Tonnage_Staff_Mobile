name: Reconstruct App.tsx

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-archive/App.tsx.gz.b64.part*'
      - '.github/workflows/reconstruct-app.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact App.tsx
        shell: bash
        run: |
          cat source-archive/App.tsx.gz.b64.part* > App.tsx.gz.b64
          base64 --decode App.tsx.gz.b64 > App.tsx.gz
          gzip -dc App.tsx.gz > App.tsx
          rm -f App.tsx.gz.b64 App.tsx.gz
          echo "App.tsx SHA-256: $(sha256sum App.tsx | cut -d' ' -f1)"

      - name: Commit App.tsx
        shell: bash
        run: |
          if git ls-files --error-unmatch App.tsx >/dev/null 2>&1 && git diff --quiet -- App.tsx; then
            echo 'App.tsx is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx
          git commit -m 'Restore exact mobile App.tsx v0.11.0'
          git push
